name: test

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-skill.mjs
      - run: node --check skills/review-fix-ship/scripts/reviewctl.mjs
      - run: node --check skills/review-fix-ship/scripts/reviewctl.test.mjs
      - run: node --test skills/review-fix-ship/scripts/reviewctl.test.mjs
